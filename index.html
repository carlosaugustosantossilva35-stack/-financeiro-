<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle financeiro</title>
<meta name="theme-color" content="#0e6b66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eaf0ef;--card:#fff;--ink:#12272a;--mute:#5d7376;--line:#d5e0df;--acc:#0e6b66;--acc-ink:#fff;--bad:#b3261e;--track:#dfe9e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1d;--card:#16282b;--ink:#e6f1f0;--mute:#8fa8aa;--line:#264044;--acc:#4fc3b9;--acc-ink:#07201e;--bad:#ff8a80;--track:#223a3d}}
:root[data-theme="dark"]{--bg:#0e1b1d;--card:#16282b;--ink:#e6f1f0;--mute:#8fa8aa;--line:#264044;--acc:#4fc3b9;--acc-ink:#07201e;--bad:#ff8a80;--track:#223a3d}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav h1{font-size:1.05rem;font-weight:700;margin:0;text-transform:capitalize}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:1.1rem;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.total{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0 0}
.lbl{color:var(--mute);font-size:.85rem;margin:0}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin:14px 0 8px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.over>i{background:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{font-size:.9rem;font-weight:500}
.status.over{color:var(--bad)}
.budget{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
.budget input{width:110px;text-align:right}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--track);margin:10px 0 14px}
.seg i{display:block;height:100%}
.cat{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.95rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cat .n{flex:1}
.cat .p{color:var(--mute);font-size:.85rem;width:42px;text-align:right}
.cat .v,.it .v{font-variant-numeric:tabular-nums;font-weight:700}
h2{font-size:1rem;margin:0 0 4px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
form .full{grid-column:1/-1}
.add{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;cursor:pointer}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t span{font-size:.8rem;color:var(--mute)}
.del{background:none;border:0;color:var(--mute);font-size:1.2rem;cursor:pointer;width:36px;height:36px;border-radius:10px}
.del:hover{color:var(--bad)}
.empty{color:var(--mute);text-align:center;padding:18px 0 6px;margin:0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sum div{background:var(--bg);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.pos{color:var(--acc)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.seg2 button{border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:9px;border-radius:9px;cursor:pointer}
.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.filt{display:flex;gap:6px;margin:10px 0 4px}
.filt button{border:1px solid var(--line);background:none;color:var(--mute);font:inherit;font-size:.85rem;padding:6px 12px;border-radius:99px;cursor:pointer}
.filt button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sync{color:var(--mute);font-size:.8rem;text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<main>
  <div class="nav">
    <button id="prev" aria-label="Mês anterior">‹</button>
    <h1 id="mes"></h1>
    <button id="next" aria-label="Próximo mês">›</button>
  </div>

  <section class="card">
    <p class="lbl">Saldo do mês</p>
    <p class="total" id="saldo">R$ 0,00</p>
    <div class="sum"><div><span class="lbl">Entradas</span><b class="pos" id="ent">R$ 0,00</b></div><div><span class="lbl">Gastos</span><b id="total">R$ 0,00</b></div></div>
    <div class="bar" id="bar"><i style="width:0"></i></div>
    <div class="row">
      <span class="status" id="status"></span>
      <label class="budget">Orçamento <input id="orc" type="number" inputmode="decimal" min="0" step="50" placeholder="0"></label>
    </div>
  </section>

  <section class="card">
    <h2>Por categoria</h2>
    <div class="seg" id="seg"></div>
    <div id="cats"></div>
  </section>

  <section class="card">
    <h2>Novo lançamento</h2>
    <form id="f">
      <div class="seg2 full"><button type="button" id="tg" class="on">Gasto</button><button type="button" id="te">Entrada</button></div>
      <input class="full" id="desc" placeholder="Descrição (ex.: mercado, salário)" required maxlength="60">
      <input id="valor" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="Valor (R$)" required>
      <input id="data" type="date" required>
      <select class="full" id="cat"></select>
      <button class="add full" type="submit">Adicionar</button>
    </form>
  </section>

  <section class="card">
    <h2>Lançamentos</h2>
    <div class="filt" id="filt"><button data-f="todos" class="on">Todos</button><button data-f="entrada">Entradas</button><button data-f="gasto">Gastos</button></div>
    <div id="lista"></div>
  </section>
  <p class="sync" id="sync"></p>
</main>

<script>
var CATS=[["Moradia","#0e6b66"],["Mercado","#e0a526"],["Alimentação","#f08a3c"],["Transporte","#3a7bd5"],["Contas","#8e5bd6"],["Lazer","#e5626f"],["Saúde","#2fa36b"],["Outros","#8a9a9c"]];
var ECATS=["Salário","Freelance","Rendimentos","Reembolso","Presente","Outros"];
var KEY="controle-financeiro-v1";
var S={items:[],budget:0},tipo="gasto",filtro="todos";
function norm(p){return p&&Array.isArray(p.items)?{items:p.items,budget:+p.budget||0}:null;}
try{var raw=localStorage.getItem(KEY);if(raw){S=norm(JSON.parse(raw))||S;}}catch(e){}
function setSync(t){$("sync").textContent=t;}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}
var brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function $(id){return document.getElementById(id);}
var hoje=new Date();
var cur=new Date(hoje.getFullYear(),hoje.getMonth(),1);
function mk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function iso(d){return mk(d)+"-"+String(d.getDate()).padStart(2,"0");}
function color(c){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===c)return CATS[i][1];return "#8a9a9c";}
function isE(i){return i.tipo==="entrada";}
function fillCats(){$("cat").innerHTML=(tipo==="entrada"?ECATS:CATS.map(function(c){return c[0];})).map(function(c){return "<option>"+c+"</option>";}).join("");}
fillCats();
$("data").value=iso(hoje);
function setTipo(t){tipo=t;$("tg").className=t==="gasto"?"on":"";$("te").className=t==="entrada"?"on":"";fillCats();}
$("tg").onclick=function(){setTipo("gasto");};
$("te").onclick=function(){setTipo("entrada");};
$("filt").onclick=function(e){var f=e.target.getAttribute&&e.target.getAttribute("data-f");if(!f)return;filtro=f;render();};

function render(){
  var key=mk(cur);
  $("mes").textContent=cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  var all=S.items.filter(function(i){return i.data.indexOf(key)===0;}).sort(function(a,b){return a.data<b.data?1:-1;});
  var its=all.filter(function(i){return !isE(i);});
  var total=its.reduce(function(s,i){return s+i.valor;},0);
  var ent=all.filter(isE).reduce(function(s,i){return s+i.valor;},0);
  $("total").textContent=brl.format(total);
  $("ent").textContent=brl.format(ent);
  $("saldo").textContent=brl.format(ent-total);
  $("orc").value=S.budget||"";
  var bar=$("bar"),st=$("status");
  if(S.budget>0){
    var pct=Math.min(100,total/S.budget*100);
    bar.firstElementChild.style.width=pct+"%";
    var over=total>S.budget;
    bar.className="bar"+(over?" over":"");
    st.className="status"+(over?" over":"");
    st.textContent=over?"Passou "+brl.format(total-S.budget):"Restam "+brl.format(S.budget-total);
  }else{
    bar.firstElementChild.style.width="0";bar.className="bar";st.className="status";
    st.textContent="Defina um orçamento para acompanhar";
  }
  var by={};its.forEach(function(i){by[i.cat]=(by[i.cat]||0)+i.valor;});
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a];});
  $("seg").innerHTML=ks.map(function(k){return '<i title="'+esc(k)+'" style="width:'+(by[k]/total*100)+'%;background:'+color(k)+'"></i>';}).join("");
  $("cats").innerHTML=ks.length?ks.map(function(k){
    return '<div class="cat"><span class="dot" style="background:'+color(k)+'"></span><span class="n">'+esc(k)+'</span><span class="p">'+Math.round(by[k]/total*100)+'%</span><span class="v">'+brl.format(by[k])+'</span></div>';
  }).join(""):'<p class="empty">Nenhum gasto neste mês.</p>';
  Array.prototype.forEach.call($("filt").children,function(b){b.className=b.getAttribute("data-f")===filtro?"on":"";});
  var vis=all.filter(function(i){return filtro==="todos"||(filtro==="entrada")===isE(i);});
  $("lista").innerHTML=vis.length?vis.map(function(i){
    var d=i.data.split("-"),e=isE(i);
    return '<div class="it"><span class="dot" style="background:'+(e?'var(--acc)':color(i.cat))+'"></span><div class="t"><b>'+esc(i.desc)+'</b><span>'+d[2]+'/'+d[1]+' · '+esc(i.cat)+(e?' · entrada':'')+'</span></div><span class="v'+(e?' pos':'')+'">'+(e?'+ ':'')+brl.format(i.valor)+'</span><button class="del" data-id="'+i.id+'" aria-label="Apagar lançamento">×</button></div>';
  }).join(""):'<p class="empty">Nenhum lançamento aqui ainda.</p>';
}

$("prev").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render();};
$("next").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render();};
$("orc").onchange=function(){S.budget=Math.max(0,parseFloat(this.value)||0);save();render();};
$("f").onsubmit=function(e){
  e.preventDefault();
  var v=parseFloat($("valor").value);
  if(!(v>0))return;
  S.items.push({id:Date.now()+Math.random().toString(36).slice(2,6),tipo:tipo,desc:$("desc").value.trim(),valor:v,cat:$("cat").value,data:$("data").value});
  var d=$("data").value.split("-");cur=new Date(+d[0],+d[1]-1,1);
  save();$("desc").value="";$("valor").value="";render();$("desc").focus();
};
$("lista").onclick=function(e){
  var id=e.target.getAttribute&&e.target.getAttribute("data-id");
  if(!id)return;
  S.items=S.items.filter(function(i){return i.id!==id;});save();render();
};
render();
setSync("Salvo neste aparelho");

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
</html>
